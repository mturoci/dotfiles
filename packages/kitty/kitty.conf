# Paste behavior
paste_actions no-op

# Enable OSC 52 clipboard support for remote sessions
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Keyboard mappings
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66
map cmd+e send_text all \x1bauto
mouse_map cmd+left release grabbed,ungrabbed mouse_click_url

# Cursor settings
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# URL settings
open_url_with default
url_color #6569cf
url_style straight

# Font settings
font_family      family="JetBrainsMono Nerd Font Mono"

bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.8
modify_font cell_height 3.2
modify_font cell_width 94%
text_composition_strategy legacy
macos_thicken_font 0.2
scrollback_lines 2000

# Window settings
hide_window_decorations yes
background_opacity 0.8
macos_option_as_alt yes

confirm_os_window_close 0

# Theme
include current-theme.conf
