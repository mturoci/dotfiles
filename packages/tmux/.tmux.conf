set -g default-terminal "tmux-256color"

# Forward modified keys (Shift+Enter, Ctrl+Enter, super+... etc.) to apps like pi.
# tmux 3.5+ can also add: set -g extended-keys-format csi-u
set -g extended-keys on

# Enable OSC 52 clipboard support over SSH
set -g set-clipboard on
set -g allow-passthrough on

# Terminal overrides for OSC 52 (critical for kitty)
# set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\7"
# set -ag terminal-overrides ",xterm-kitty:Ms=\\E]52;c;%p2%s\\7"
# set -ag terminal-overrides ",screen-256color-bce:Ms=\\E]52;c;%p2%s\\7"

set -as terminal-features ',tmux-256color:clipboard'

set -g prefix C-j
unbind C-b
bind-key C-j send-prefix
unbind r
bind r source-file ~/.tmux.conf

# Move between panes with Option+{h,j,k,l} (Alt+hjkl).
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U

bind c new-window -c "#{pane_current_path}"
bind q killw
unbind %
bind / split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Open and start Wave project.
bind-key W \
  new-window -c "/Users/mturoci/projects/wave/py" -n "wave" \; \
  send "source venv/bin/activate && cd examples" ENTER \; \
  split-window -h -c "/Users/mturoci/projects/wave" \; \
  send "make run-ui" ENTER \; \
  split-window -v -c "/Users/mturoci/projects/wave" \; \
  select-pane -L \; \
  split-window -v -c "/Users/mturoci/projects/wave" \; \
  send "make run" ENTER \; \
  select-pane -U \; \

bind -n M-- select-layout even-vertical
bind -n M-/ select-layout even-horizontal

bind -n C-l send-keys 'C-l'

bind -r m resize-pane -Z

set -g mouse on

set -g renumber-windows on
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Do not ask for confirmation when killing a pane.
bind-key x kill-pane

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key V split-window -h 'tmux capture-pane -t:.- -Jp -S- | nvim -'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

run '~/.tmux/plugins/tpm/tpm'

set -g @TC "#a7c080"
set -g @BG '#2C2B2A'
set -g @FG '#626262'
set -g @LIGHT_BG '#3a3a3a'
set -g @RED "#f5424e"
set -g @KITTY_BG "#272627"

# Status bar
set -g status-fg "#000000"
set -g status-style bg=default,fg=default
set -g mode-style "bg=#{@TC},fg=#{@FG}"
set -g window-status-style fg=default,bg=default
set -g window-status-format         "#[fg=#{@KITTY_BG},bg=#{@LIGHT_BG}]#[fg=#{@TC},bg=#{@LIGHT_BG}] #I:#W #[fg=#{@LIGHT_BG},bg=default]"
set -g window-status-current-format "#[fg=#{@KITTY_BG},bg=#{@TC}]#[fg=#{@BG},bg=#{@TC},bold] #I:#W #[fg=#{@TC},bg=default,nobold]"
set -g window-status-separator ""

set -g pane-border-style "fg=#{@LIGHT_BG},bg=default"
set -g pane-active-border-style "fg=#{@TC},bg=default"

set-option -g status-left-length 2000
set-option -g status-right-length 2000
set -g status-position top
set -g status-left ""
set -g status-right '#(~/.tmux/right_status.sh)'


# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
